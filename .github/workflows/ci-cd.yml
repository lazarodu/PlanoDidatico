name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend - testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Executar testes
        run: pytest -q

      - name: Validar build da imagem Docker
        run: docker build -t planos-didaticos-api:ci .

  frontend:
    name: Frontend - testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Build de produção
        run: npm run build

  deploy-backend:
    name: Deploy Backend - Render
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Disparar deploy no Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Configure o secret RENDER_DEPLOY_HOOK_URL no repositório."
            exit 1
          fi

          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) separator="&" ;;
            *)    separator="?" ;;
          esac

          deploy_url="${RENDER_DEPLOY_HOOK_URL}${separator}ref=${COMMIT_SHA}"
          response="$(curl --fail --silent --show-error -X POST "$deploy_url")"
          echo "Resposta do Render: $response"

          deploy_id="$(printf '%s' "$response" | jq -r '.deploy.id // empty' 2>/dev/null || true)"
          {
            echo "### Backend publicado no Render :rocket:"
            echo ""
            echo "- Commit: \`$COMMIT_SHA\`"
            if [ -n "$deploy_id" ]; then
              echo "- Deploy ID: \`$deploy_id\`"
            fi
            echo "- Acompanhe em https://dashboard.render.com/"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy Frontend - Vercel
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Baixar configurações e variáveis do projeto
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build de produção com a Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar na Vercel
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Frontend publicado na Vercel :rocket:"
            echo ""
            echo "- URL: $url"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
