[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-planos-didaticos"
version = "1.0.0"
description = "Backend do Sistema de Planos Didáticos - CEFET-MG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "reportlab>=4.1.0",
    "aiosmtplib>=3.0.1",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
